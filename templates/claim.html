<!DOCTYPE html>
<html>
<head>
    <title>Claim Verification</title>

    <style>
        body {
            background: #0b0b0b;
            font-family: Arial;
            color: white;
            margin: 0;
        }

        /* NAVBAR */
        .nav {
            width: 100%;
            padding: 18px 40px;
            border-bottom: 1px solid #1aff66;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #1aff66;
            font-size: 22px;
            font-weight: bold;
        }

        .nav-right a {
            margin-left: 25px;
            color: #1aff66;
            text-decoration: none;
        }

        /* CENTER CARD */
        .container {
            display: flex;
            justify-content: center;
            margin-top: 60px;
        }

        .card {
            width: 420px;
            background: #111;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,255,120,0.15);
        }

        h2 {
            margin-bottom: 25px;
        }

        /* INPUTS */
        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            margin-bottom: 18px;
            background: #0b0b0b;
            border: 1px solid #1aff66;
            color: white;
            border-radius: 8px;
            font-size: 14px;
        }

        textarea {
            height: 90px;
            resize: none;
        }

        label {
            font-size: 14px;
            color: #ccc;
        }

        /* BUTTON */
        .btn {
            width: 100%;
            padding: 12px;
            background: #1aff66;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover {
            background: #00cc55;
        }

    </style>
</head>
<body>

<!-- NAVBAR -->
<div class="nav">
    <div class="logo">Lost & Found Portal</div>

    <div class="nav-right">
        <a href="/home">Home</a>
        <a href="/lost">Lost</a>
        <a href="/found">Found</a>
        <a href="/matches">Matches</a>
        <a href="/logout">Logout</a>
    </div>
</div>

<!-- FORM -->
<div class="container">
    <div class="card">
        <h2>Claim Verification</h2>

        <form method="POST" enctype="multipart/form-data">

            <label>Your Name</label>
            <input type="text" name="name" placeholder="Enter your name" required>

            <label>Phone Number</label>
            <input type="text" name="phone" placeholder="Enter phone number" required>

            <label>Describe why item is yours</label>
            <textarea name="proof" placeholder="Describe identifying marks, details, etc." required></textarea>

            <label>Upload Proof Image</label>
            <input type="file" name="proof_image" required>

            <button class="btn">Submit Claim</button>

        </form>
    </div>
</div>

</body>
</html>
