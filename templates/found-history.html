<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Found History</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

<nav class="navbar">
    <div class="brand">Lost & Found</div>

    <div class="nav-links">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('profile') }}">Profile</a>
    </div>
</nav>

<div class="container">

    <h1 class="page-title">Found Items History</h1>

    {% if found_items %}
        {% for item in found_items %}
            <div class="card">
                <h3>{{ item[1] }}</h3>
                <p>Category: {{ item[2] }}</p>
                <p>Color: {{ item[3] }}</p>
                <p>Location: {{ item[4] }}</p>
            </div>
        {% endfor %}
    {% else %}
        <div class="card">No found items yet</div>
    {% endif %}

</div>

<footer>© 2026 Lost & Found Portal</footer>

</body>
</html>
